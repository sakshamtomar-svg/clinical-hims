services:
  - type: web
    name: clinical-hims-demo
    runtime: python
    branch: hims-v2-development

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"

      - key: SECRET_KEY
        generateValue: true
